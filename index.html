<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NovaTech Solutions - Inventario</title>

    <link rel="stylesheet" href="css/styles.css">
</head>

<body>

    <header>
        <h1>NovaTech Solutions</h1> 
        <p>Sistema de gestión de inventario</p>
    </header>

    <main>

        <section class="form-section">

            <h2>Agregar producto</h2>

            <form id="productForm">

                <div class="form-group">
                    <label for="name">Nombre</label>
                    <input
                        type="text"
                        id="name"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="price">Precio</label>
                    <input
                        type="number"
                        id="price"
                        min="0"
                        step="0.01"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="category">Categoría</label>
                    <input
                        type="text"
                        id="category"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="stock">Stock</label>
                    <input
                        type="number"
                        id="stock"
                        min="0"
                        required
                    >
                </div>

                <button type="submit">
                    Guardar producto
                </button>

            </form>

        </section>

        <section class="inventory-section">

            <h2>Inventario</h2>

            <table>

                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Nombre</th>
                        <th>Precio</th>
                        <th>Categoría</th>
                        <th>Stock</th>
                        <th>Acciones</th>
                    </tr>
                </thead>

                <tbody id="productTableBody">
                </tbody>

            </table>

            <p id="emptyMessage">
                No hay productos registrados.
            </p>

        </section>

    </main>

    <script src="js/app.js"></script>

</body>
</html>
